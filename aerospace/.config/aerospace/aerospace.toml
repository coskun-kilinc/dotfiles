# AeroSpace Window Manager Configuration

# ----------------------------------------
# Startup and Session Management
# ----------------------------------------

# Commands to be executed after user login
after-login-command = []

# Commands to be executed after AeroSpace starts
after-startup-command = []

# Automatically start AeroSpace on login
start-at-login = true

# ----------------------------------------
# Window Normalization Settings
# ----------------------------------------

# Flatten nested containers when normalizing layouts
enable-normalization-flatten-containers = true

# Adjust container orientation when nested inside another container
enable-normalization-opposite-orientation-for-nested-containers = true

# Spacing adjustment for accordion layout
accordion-padding = 30

# ----------------------------------------
# Default Layout and Orientation
# ----------------------------------------

# Layout for the root container
# Options: 'tiles' (default tiling) | 'accordion' (stacked accordion style)
default-root-container-layout = 'tiles'

# Default orientation for the root container
# Options:
#  - 'horizontal' (default to horizontal layout)
#  - 'vertical' (default to vertical layout)
#  - 'auto' (automatically determine based on monitor dimensions)
default-root-container-orientation = 'auto'

# ----------------------------------------
# Input Settings
# ----------------------------------------

# Keyboard layout preset
key-mapping.preset = 'qwerty'

# Ensure mouse cursor follows focused monitor change
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# ----------------------------------------
# Window and Monitor Gaps
# ----------------------------------------

# Defines gaps between windows (inner-*) and gaps between windows and monitor edges (outer-*)
[gaps]
inner.horizontal = 10  # Horizontal gap between windows
inner.vertical = 10    # Vertical gap between windows
outer.left = 10        # Gap on the left edge of the monitor
outer.bottom = 10      # Gap on the bottom edge of the monitor
outer.top = 10         # Gap on the top edge of the monitor
outer.right = 10       # Gap on the right edge of the monitor

# ----------------------------------------
# Keybindings: Main Mode
# ----------------------------------------

# The 'main' mode must always be defined.
[mode.main.binding]

# Window Navigation (i3-style movement)
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

# Moving windows in the workspace
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Window resizing commands
# Reduce window size
ctrl-shift-minus = 'resize smart -100'
# Increase window size
ctrl-shift-equal = 'resize smart +100'
# Balance window sizes evenly
cmd-shift-equal = 'balance-sizes'

# Layout Normalization
# alt-h = 'join-with horizontal'  # Merge container horizontally
# alt-v = 'join-with vertical'    # Merge container vertically

# Fullscreen mode toggle
alt-shift-f = 'fullscreen'

# Change window layout
alt-s = 'layout v_accordion'    # Vertical accordion layout
alt-w = 'layout h_accordion'    # Horizontal accordion layout
alt-e = 'layout tiles horizontal vertical'  # Adaptive tiling layout

# Toggle between floating and tiling modes
alt-shift-space = 'layout floating tiling'

# ----------------------------------------
# Workspace Management
# ----------------------------------------

# Switch between workspaces using Alt + [1-9]
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move the currently focused window to a specific workspace
alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'

# Move workspace to a specific monitor
alt-ctrl-1 = 'move-workspace-to-monitor 1'
alt-ctrl-2 = 'move-workspace-to-monitor 2'
alt-ctrl-3 = 'move-workspace-to-monitor 3'


# ----------------------------------------
# Mode Switching
# ----------------------------------------

# Switch to service mode
alt-shift-semicolon = 'mode service'

# Switch to resize mode
alt-r = 'mode resize'

# Reload AeroSpace configuration
alt-shift-c = 'reload-config'



# ----------------------------------------
# Service Mode Keybindings
# ----------------------------------------

[mode.service.binding]

# Exit service mode and return to main mode
esc = ['reload-config', 'mode main']

# Reset layout by flattening workspace tree
r = ['flatten-workspace-tree', 'mode main']

# Toggle floating/tiling mode
f = ['layout floating tiling', 'mode main']

# Close all windows except the current one
backspace = ['close-all-windows-but-current', 'mode main']

# Merge windows into a single container in different directions
alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

# ----------------------------------------
# Resize Mode Keybindings
# ----------------------------------------

[mode.resize.binding]

# Resize windows using h/j/k/l keys
h = 'resize width -50'   # Shrink width
j = 'resize height +50'  # Increase height
k = 'resize height -50'  # Shrink height
l = 'resize width +50'   # Increase width

# Exit resize mode
enter = 'mode main'
esc = 'mode main'


# ----------------------------------------
# App Workspace Mapping
# ----------------------------------------

# Layout:
#    - 1: Terminal, skim, ChatGPT app
#    - 2: Productivity: Browsers (Safari, Firefox), MS Teams, OmniFocus, Zotero, Obsidian
#    - 3: Social: Discord, Messages
#    - 4: Entertainment: Spotify
#
# 894   | com.apple.finder              | Finder
# 1302  | com.apple.MobileSMS           | Messages
# 1341  | com.hnc.Discord               | Discord
# 1447  | com.spotify.client            | Spotify
# 1813  | com.openai.chat               | ChatGPT
# 23419 | com.apple.iCal                | Calendar
# 42021 | com.apple.ActivityMonitor     | Activity Monitor
# 42239 | com.microsoft.teams2          | Microsoft Teams
# 59491 | org.zotero.zotero             | Zotero
# 67861 | com.electron.dockerdesktop    | Docker Desktop
# 67953 | com.microsoft.VSCode          | Code
# 68759 | com.apple.iBooksX             | Books
# 69956 | net.sourceforge.skim-app.skim | Skim
# 74452 | com.googlecode.iterm2         | iTerm2
# 81216 | md.obsidian                   | Obsidian
# 4135  | com.omnigroup.OmniFocus4      | OmniFocus
# 4212  | com.microsoft.Word            | Microsoft Word
# 66759 | org.mozilla.firefox           | Firefox

# ----------------------------------------
# Workspace 1: Terminal, Skim, ChatGPT
# ----------------------------------------

[[on-window-detected]]
    if .app-id = "com.googlecode.iterm2"
    run = 'move-node-to-workspace 1' 
[[on-window-detected]]
    if .app-id = "net.sourceforge.skim-app.skim"
    run = 'move-node-to-workspace 1' 
[[on-window-detected]]
    if .app-id = "com.openai.chat"
    run = 'move-node-to-workspace 1' 
[[on-window-detected]]
    if .app-id = "com.electron.dockerdesktop"
    run = 'move-node-to-workspace 1'

# ----------------------------------------
# Workspace 2: Browsers, MS Teams, OmniFocus, Zotero, Obsidian
# ----------------------------------------

[[on-window-detected]]
    if .app-id = "org.mozilla.firefox"
    run = 'move-node-to-workspace 2' 
[[on-window-detected]]
    if .app-id = "com.apple.Safari"
    run = 'move-node-to-workspace 2' 
[[on-window-detected]]
    if .app-id = "com.omnigroup.OmniFocus4"
    run = 'move-node-to-workspace 2' 
[[on-window-detected]]
    if .app-id = "com.microsoft.teams2"
    run = 'move-node-to-workspace 2' 
[[on-window-detected]]
    if .app-id = "org.zotero.zotero"
    run = 'move-node-to-workspace 2' 
[[on-window-detected]]
    if .app-id = "md.obsidian"
    run = 'move-node-to-workspace 2'

# ----------------------------------------
# Workspace 3: Discord, Messages
# ----------------------------------------

[[on-window-detected]]
    if .app-id = "com.hnc.Discord"
    run = 'move-node-to-workspace 3' 
[[on-window-detected]]
    if .app-id = "com.apple.MobileSMS"
    run = 'move-node-to-workspace 3'


# ----------------------------------------
# Workspace 4: Spotify
# ----------------------------------------

[[on-window-detected]]
    if .app-id = "com.spotify.client"
    run = 'move-node-to-workspace 4'
